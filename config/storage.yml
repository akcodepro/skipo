test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

cloudinary_profile_photos:
  <% if Rails.env.test? %>
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>
  <% elsif Rails.env.development? %>
  service: Disk
  root: <%= Rails.root.join("storage") %>
  <% else %>
  service: Cloudinary
  folder: <%= "skipo/#{Rails.env}/profile_photos" %>
  <% end %>

cloudinary_workout_photos:
  <% if Rails.env.test? %>
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>
  <% elsif Rails.env.development? %>
  service: Disk
  root: <%= Rails.root.join("storage") %>
  <% else %>
  service: Cloudinary
  folder: <%= "skipo/#{Rails.env}/workout_photos" %>
  <% end %>

cloudinary:
  service: Cloudinary
  folder: <%= "skipo/#{Rails.env}" %>
